name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use workspace npm version
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/trpc-webrtc-link/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: npm run check
      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./packages/trpc-webrtc-link/package.json').name")"
          package_version="$(node -p "require('./packages/trpc-webrtc-link/package.json').version")"
          if npm view "$package_name@$package_version" version --json > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish --workspace @webrtc-node/trpc-webrtc-link --access public
      - name: Confirm existing publication
        if: steps.registry.outputs.published == 'true'
        run: echo "Package version is already published; skipping npm publish."
