name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use workspace npm version
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Verify Chrome
        run: google-chrome --version
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            packages/trpc-webrtc-link/coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - run: mkdir package-artifact
      - run: npm pack --workspace @mertushka/trpc-webrtc-link --pack-destination package-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: package-artifact/*.tgz
          if-no-files-found: error

  runtime:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22.18.0
          - 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package-artifact
      - run: node scripts/test-packed-package.mjs --runtime-only --tarball package-artifact/*.tgz
