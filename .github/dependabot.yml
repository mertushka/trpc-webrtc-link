version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Keep development types aligned with the Node.js 24 CI/build target.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # TypeScript 7 is outside typescript-eslint's currently supported range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci(deps)
